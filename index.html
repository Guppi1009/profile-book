<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プロフィール帳</title>
<meta name="description" content="人物やキャラクターの名前を検索すると、画像と「名前・出身・年齢・好きなもの・嫌いなもの」を1画面に表示します。Wikipediaの情報だけを使う無料のミニアプリ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5f7; --dot:#ffd3de; --paper:#ffffff; --ink:#4a3b40; --muted:#9a8a90; --line:#ffd6e0;
  --accent:#ff8fab; --accent2:#ff6f91; --accent-ink:#fff; --chip:#fff0f4; --chip-ink:#6b4a56;
  --frame:#fff8ea; --frame-dot:#ffe4b8; --tape:rgba(255,205,120,.75); --tape2:rgba(180,225,245,.8);
  --shadow:0 12px 34px rgba(255,120,160,.18); --link:#3f8ec9; --label-ink:#5a3a46;
  --c-pink:#ffc8d6; --c-mint:#c9f0dd; --c-yellow:#fff0a8; --c-lavender:#e2d6ff; --c-sky:#cfe9ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a2130; --dot:#3a2d42; --paper:#342a3b; --ink:#f7ecf1; --muted:#b8a7b3; --line:#4b3a4f;
    --accent:#ff8fab; --accent2:#ff6f91; --chip:#43354a; --chip-ink:#f2dbe6; --frame:#3d3140; --frame-dot:#4a3c4e;
    --tape:rgba(255,205,120,.45); --tape2:rgba(180,225,245,.45); --shadow:0 12px 34px rgba(0,0,0,.35); --link:#8fc4ee; --label-ink:#3b2530;
    --c-pink:#f4a9be; --c-mint:#9fdcc0; --c-yellow:#f3dd86; --c-lavender:#c7b6f2; --c-sky:#a9d3f5;
  }
}
:root[data-theme="dark"]{
  --bg:#2a2130; --dot:#3a2d42; --paper:#342a3b; --ink:#f7ecf1; --muted:#b8a7b3; --line:#4b3a4f;
  --chip:#43354a; --chip-ink:#f2dbe6; --frame:#3d3140; --frame-dot:#4a3c4e;
  --tape:rgba(255,205,120,.45); --tape2:rgba(180,225,245,.45); --shadow:0 12px 34px rgba(0,0,0,.35); --link:#8fc4ee; --label-ink:#3b2530;
  --c-pink:#f4a9be; --c-mint:#9fdcc0; --c-yellow:#f3dd86; --c-lavender:#c7b6f2; --c-sky:#a9d3f5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.7px,transparent 1.9px);background-size:22px 22px;
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-weight:500;line-height:1.4;
}
#app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:12px 16px 14px;max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:"Hachi Maru Pop","Zen Maru Gothic",sans-serif;font-weight:400;font-size:clamp(19px,2.9vh,26px);margin:0;letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--accent2)}
h1 .mark{font-size:1.15em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
form{display:flex;gap:8px;flex:1;min-width:240px}
.search{flex:1;display:flex;align-items:center;gap:8px;min-width:0;padding:0 8px 0 14px;border-radius:999px;border:3px solid var(--line);background:var(--paper);box-shadow:0 4px 0 rgba(255,143,171,.18)}
.search:focus-within{border-color:var(--accent)}
.search .ico{font-size:1.1em;opacity:.8}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:clamp(15px,2.2vh,18px);padding:9px 4px;border:0;background:transparent;color:var(--ink);outline:none}
input[type=search]::placeholder{color:#c9b3bc}
button.go{font:inherit;font-weight:700;font-size:clamp(14px,2vh,16px);padding:10px 20px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 #d95a7e;transition:transform .08s}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #d95a7e}
button.share{font:inherit;font-weight:700;font-size:clamp(12px,1.8vh,14px);padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--chip-ink);cursor:pointer;white-space:nowrap}
button.share:hover{border-color:var(--accent)}
#chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;min-height:0;scrollbar-width:none;align-items:center}
#chips::-webkit-scrollbar{display:none}
#chips:empty{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:clamp(12px,1.7vh,14px);padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--chip);color:var(--chip-ink);cursor:pointer;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--accent);background:var(--paper)}
.chip .d{opacity:.7;font-size:.86em}
main.card{
  min-height:0;display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:0;
  background:var(--paper);border-radius:28px;box-shadow:var(--shadow);border:3px solid var(--line);overflow:hidden;position:relative;
}
main.card::before,main.card::after{content:"";position:absolute;z-index:3;width:110px;height:26px;top:-6px;pointer-events:none;
  background:repeating-linear-gradient(135deg,var(--tape) 0 8px,rgba(255,255,255,.35) 8px 12px);opacity:.95;box-shadow:0 1px 3px rgba(0,0,0,.08)}
main.card::before{left:26px;transform:rotate(-6deg)}
main.card::after{right:70px;transform:rotate(5deg);background:repeating-linear-gradient(135deg,var(--tape2) 0 8px,rgba(255,255,255,.35) 8px 12px)}
.photo{
  position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;padding:clamp(14px,3vh,28px);
  background-color:var(--frame);background-image:radial-gradient(var(--frame-dot) 1.5px,transparent 1.7px);background-size:16px 16px;
  border-right:3px dashed var(--line);
}
.photo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.photo .pola{width:100%;height:100%;min-height:0;min-width:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;background:#fff;border-radius:18px;padding:clamp(8px,1.6vh,14px);box-shadow:0 8px 22px rgba(120,60,90,.16);transform:rotate(-1.3deg);position:relative}
.photo .pola::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(2deg);
  background:repeating-linear-gradient(135deg,var(--tape2) 0 8px,rgba(255,255,255,.35) 8px 12px);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.photo img{width:100%;height:100%;min-width:0;min-height:0;max-width:100%;max-height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .25s;border-radius:12px}
.photo img.show{opacity:1}
.photo .empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:24px;color:var(--muted);font-size:clamp(13px,1.9vh,16px)}
.photo .empty .big{font-size:clamp(40px,8vh,72px);line-height:1}
.photo .empty .pick{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(100%,260px);margin:4px auto 0}
.photo .empty .pbtn{font:inherit;font-weight:700;font-size:clamp(13px,1.9vh,15px);padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--chip-ink);cursor:pointer;text-decoration:none;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.photo .empty .pbtn.g{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.photo .empty .pbtn:active{transform:translateY(2px);box-shadow:none}
.photo .empty .hint{font-size:clamp(11px,1.5vh,12px);color:var(--muted)}
.photo .cap .capbtn{font:inherit;font-size:inherit;color:var(--link);background:none;border:0;padding:0;cursor:pointer}
.photo.drag .pola{outline:4px dashed var(--accent);outline-offset:-8px}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 12px;font-size:clamp(10px,1.4vh,12px);color:var(--muted);background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(3px);display:flex;justify-content:space-between;gap:8px}
.photo .cap:empty{display:none}
.photo .cap a{color:var(--link);text-decoration:none}
.info{min-height:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));padding:clamp(6px,1.2vh,14px) clamp(14px,2.4vw,28px) clamp(6px,1.2vh,14px) clamp(14px,2.4vw,28px)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(10px,1.6vw,18px);border-bottom:2px dotted var(--line);min-height:0;padding:2px 0}
.row:last-child{border-bottom:0}
.row .k{
  width:clamp(96px,10.5vw,132px);text-align:center;font-family:"Hachi Maru Pop","Zen Maru Gothic",sans-serif;font-size:clamp(12px,1.8vh,15px);letter-spacing:.04em;
  color:var(--label-ink);border-radius:999px;padding:5px 0;box-shadow:0 3px 0 rgba(0,0,0,.06);white-space:nowrap;
}
.row.name .k{background:var(--c-pink)} .row.origin .k{background:var(--c-mint)} .row.age .k{background:var(--c-yellow)} .row.like .k{background:var(--c-lavender)} .row.dislike .k{background:var(--c-sky)} .row.can .k{background:#ffd9b8} .row.cant .k{background:#e6e6e6}
.row .v{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.row .v .main{
  font-weight:700;font-size:clamp(18px,3.1vh,30px);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;
}
.row.name .v .main{font-size:clamp(18px,3.1vh,30px)}
.row .v .sub{font-size:clamp(10px,1.4vh,13px);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v .sub .sq{color:var(--link);text-decoration:none;font-weight:700;padding:2px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper)}
.row .v .main.none{color:var(--muted);font-weight:500}
.row .v .main.wait{color:var(--muted);font-weight:500;font-size:clamp(14px,2.2vh,18px)}
.row .v .main.wait::after{content:"…";animation:dots 1s steps(3,end) infinite}
@keyframes dots{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
#status{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),#ffd166,#9be7c4,#b8c4ff);transform:scaleX(0);transform-origin:left;transition:transform .3s;opacity:0;z-index:4}
#status.on{opacity:1;animation:bar 1.6s ease-in-out infinite}
@keyframes bar{0%{transform:scaleX(0)}70%{transform:scaleX(.85)}100%{transform:scaleX(.85)}}
#msg{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:8px 16px;border-radius:999px;font-size:clamp(12px,1.8vh,14px);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:5}
#msg.on{opacity:.95}
/* 共有パネル */
#favBox{position:fixed;inset:0;display:none;place-items:center;background:rgba(80,40,60,.45);z-index:20;padding:16px}
#favBox.on{display:grid}
#favBox .panel{background:var(--paper);border:3px solid var(--line);border-radius:26px;padding:22px 24px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow);position:relative}
#favBox h2{font-family:"Hachi Maru Pop","Zen Maru Gothic",sans-serif;font-weight:400;font-size:20px;margin:0 0 6px;color:var(--accent2)}
#favBox p{margin:6px 0;font-size:14px;color:var(--muted)}
#favBox .qr{width:min(56vh,240px);height:auto;background:#fff;border-radius:12px;padding:6px;margin:8px auto;display:block}
#favBox .url{font-size:14px;word-break:break-all;background:var(--chip);border-radius:12px;padding:8px 10px;margin:8px 0;color:var(--ink)}
#favBox .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#favBox .favlist{max-height:52vh;overflow:auto;text-align:left;margin:8px 0;display:flex;flex-direction:column;gap:6px}
#favBox .favrow{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:6px 8px;background:var(--chip)}
#favBox .favrow .th{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-size:22px}
#favBox .favrow .th img{width:100%;height:100%;object-fit:cover}
#favBox .favrow .nm{flex:1;text-align:left;font:inherit;font-weight:700;font-size:15px;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 0}
#favBox .favrow .del{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--paper);color:var(--muted);border:2px solid var(--line);font-size:16px;padding:0}
.chip.fav{background:var(--c-yellow);border-color:#f3d77a}
.chiplabel{flex:0 0 auto;font-size:clamp(12px,1.7vh,14px);font-weight:700;color:var(--accent2);padding-left:4px;white-space:nowrap}
#favBtn{position:absolute;right:14px;top:10px;z-index:4;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font-size:24px;line-height:1;cursor:pointer;color:#e0a800;box-shadow:0 3px 0 rgba(0,0,0,.06);padding:0}
#favBtn.on{background:var(--c-yellow);border-color:#f3d77a}
#favBox button{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;border:0;cursor:pointer}
#favBox .copy{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
#favBox .close{background:var(--chip);color:var(--chip-ink)}
@media (max-width:700px), (orientation:portrait) and (max-width:1000px){
  #app{padding:10px 12px 12px}
  h1{font-size:19px}
  main.card{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,34%) minmax(0,66%)}
  button.share{font-size:0;padding:8px 10px} button.share::before{content:"⭐";font-size:14px}
  main.card::before,main.card::after{width:80px;height:20px}
  .photo{border-right:0;border-bottom:3px dashed var(--line);padding:14px 16px 10px}
  .photo .pola{padding:6px;border-radius:14px}
  .info{padding:6px 12px}
  .row .k{width:88px;font-size:12px}
  .row .v .main{font-size:clamp(15px,2.3vh,20px);-webkit-line-clamp:1}
  .row.name .v .main{font-size:clamp(15px,2.3vh,20px)}
  .row .v .sub{font-size:10px}
  .row .k{width:96px;font-size:11px}
  .chip{max-width:60vw}
  button.share{padding:7px 10px}
}
@media (max-height:520px){
  .row .v .sub{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="mark">📖</span>プロフィール帳<span class="mark">✨</span></h1>
    <form id="f" autocomplete="off">
      <label class="search"><span class="ico">🔍</span><input id="q" type="search" placeholder="名前を入れてね（例：大谷翔平・ドラえもん）" enterkeyhint="search" aria-label="名前を検索"></label>
      <button class="go" type="submit">しらべる♪</button>
    </form>
    <button class="share" type="button" id="favListBtn" title="お気に入りの一覧">⭐ お気に入り</button>
  </header>
  <div id="chips" aria-label="ほかの候補"></div>
  <main class="card">
    <div id="status"></div>
    <button type="button" id="favBtn" title="お気に入りに登録" style="display:none">☆</button>
    <section class="photo" id="photo" aria-label="画像">
      <div class="pola"><img id="img" alt=""></div>
      <div class="empty" id="empty">
        <div class="big">🔍</div>
        <div>名前を入れて「しらべる♪」を押してね</div>
      </div>
      <div class="cap" id="cap"></div>
    </section>
    <section class="info" id="info">
      <div class="row name"><div class="k">🌟 名前</div><div class="v"><div class="main" id="v-name"></div><div class="sub" id="s-name"></div></div></div>
      <div class="row origin"><div class="k">🏠 出身</div><div class="v"><div class="main" id="v-origin"></div><div class="sub" id="s-origin"></div></div></div>
      <div class="row age"><div class="k">🎂 年齢</div><div class="v"><div class="main" id="v-age"></div><div class="sub" id="s-age"></div></div></div>
      <div class="row like"><div class="k">💗 好きなもの</div><div class="v"><div class="main" id="v-like"></div><div class="sub" id="s-like"></div></div></div>
      <div class="row dislike"><div class="k">💦 嫌いなもの</div><div class="v"><div class="main" id="v-dislike"></div><div class="sub" id="s-dislike"></div></div></div>
      <div class="row can"><div class="k">💪 できること</div><div class="v"><div class="main" id="v-can"></div><div class="sub" id="s-can"></div></div></div>
      <div class="row cant"><div class="k">🙅 できないこと</div><div class="v"><div class="main" id="v-cant"></div><div class="sub" id="s-cant"></div></div></div>
    </section>
    <div id="msg"></div>
  </main>
  <input type="file" id="pick" accept="image/*" hidden>
</div>
<div id="favBox" role="dialog" aria-modal="true" aria-label="お気に入り">
  <div class="panel">
    <h2>⭐ お気に入り</h2>
    <p>カードの ☆ を押すと、この端末に登録されます</p>
    <div class="favlist" id="favList"></div>
    <div class="btns"><button class="close" id="closeFav" type="button">とじる</button></div>
  </div>
</div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   任意設定：Google画像検索の1枚目を使いたいときだけ入れる（無料枠 100回/日）。
   空のままなら Wikipedia の画像だけで動く（キー不要・完全無料）。
   ===================================================================== */
const GOOGLE_API_KEY = '';
const GOOGLE_CSE_ID  = '';

const $ = id => document.getElementById(id);
const els = {
  q:$('q'), chips:$('chips'), img:$('img'), empty:$('empty'), cap:$('cap'), photo:$('photo'), status:$('status'), msg:$('msg'),
  v:{name:$('v-name'),origin:$('v-origin'),age:$('v-age'),like:$('v-like'),dislike:$('v-dislike'),can:$('v-can'),cant:$('v-cant')},
  s:{name:$('s-name'),origin:$('s-origin'),age:$('s-age'),like:$('s-like'),dislike:$('s-dislike'),can:$('s-can'),cant:$('s-cant')},
};
const JA='https://ja.wikipedia.org/w/api.php', EN='https://en.wikipedia.org/w/api.php', WD='https://www.wikidata.org/w/api.php';
const PERSONA=/人物|キャラクター|character|主人公|架空|ロボット|ポケモン|Pokémon|選手|俳優|女優|歌手|声優|タレント|芸人|漫画家|作家|政治家|武将|大名|天皇|皇帝|国王|女王|将軍|学者|画家|音楽家|作曲家|発明家|実業家|YouTuber|アイドル|ヒーロー|妖怪|マスコット|ゆるキャラ|ライター|プロデューサー|監督|棋士|力士|レスラー|お笑い/i;
const WORK=/漫画|アニメ|作品|映画|シリーズ|番組|ゲーム|小説|ドラマ|楽曲|アルバム|会社|企業|駅|市|町|村|コムーネ|川|山|島|地名|通貨|医薬品|料理|植物|食品|姓|名前|苗字|事件|一覧|団体|バンド|グループ/;
const ORG=/事務所|会社|企業|団体|プロダクション|レーベル|チーム|ユニット|バンド|グループ|一覧|コンビ|トリオ|劇団|学校|大学|組織|機関|協会|連盟|財団|部隊|軍|世代|症候群|賞$|の(走法|技|用語|道具|地名|舞台|アイテム|設定|エピソード|楽曲|主題歌|歌|映画|作品|世界|集団|種族|乗り物|武器|能力|グッズ|ゲーム|声優|作者|原作者|作画|スタッフ|一覧|関連|用語集)/;
const isPersona=d=>PERSONA.test(d||'')&&!ORG.test(d||'');
const isWork=d=>WORK.test(d||'')&&!PERSONA.test(d||'');

let cache=new Map(), seq=0;

function norm(s){return (s||'').normalize('NFKC').replace(/[\s・･]/g,'').toLowerCase();}
function show(msg,ms=2600){els.msg.textContent=msg;els.msg.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>els.msg.classList.remove('on'),ms);}
function busy(on){els.status.classList.toggle('on',!!on);}

async function getJSON(base,params,tries=3){
  const u=base+'?'+new URLSearchParams(Object.assign({format:'json',formatversion:'2',origin:'*'},params));
  if(cache.has(u)) return cache.get(u);
  let lastErr;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(u);
      if(r.status===429||r.status>=500){lastErr=new Error('HTTP '+r.status);await new Promise(res=>setTimeout(res,700*(i+1)));continue;}
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(j&&j.error&&/^pvi/.test(j.error.code||'')&&params.prop){ // 閲覧数まわりのエラー（存在しない題名など）→ 閲覧数なしで取り直す
        const p2=Object.assign({},params);p2.prop=String(p2.prop).replace(/\|?pageviews/,'');delete p2.pvipdays;
        if(!p2.prop) throw new Error('pvi'); return getJSON(base,p2,tries);
      }
      if(j&&j.error) throw new Error(j.error.code||'api');
      cache.set(u,j); return j;
    }catch(e){lastErr=e;await new Promise(res=>setTimeout(res,500*(i+1)));}
  }
  throw lastErr;
}

/* ---------- 1. 名前 → 記事の特定 ---------- */
function cleanTitle(t){return (t||'').replace(/\s*[（(][^（）()]*[）)]\s*$/,'');}
const PAGEPROPS={prop:'description|pageprops|pageviews',ppprop:'disambiguation|wikibase_item',pvipdays:30};
const CREATIVE=/漫画|アニメ|作品|映画|シリーズ|番組|ゲーム|小説|ドラマ|絵本|特撮|戯曲/;

    const i=s.indexOf(nq); if(i<0) return 0;

    const kanaQ=KANA.test(nq.slice(-1));

    const tm=(nt===nq||nf===nq)?6:(nt.includes(nq)||nf.includes(nq))?3:0;

    const realPerson=/選手|俳優|女優|歌手|声優|タレント|芸人|漫画家|作家|政治家|YouTuber|アイドル|ライバー|ナレーター|\(\d{4}|アナウンサー|モデル|実業家|学者|監督|ミュージシャン/.test(d);
    const dm=norm(d).includes(nq)?(persona?3:2):0;
    if(!tm&&!dm&&!(nctxs.length&&(x.ft||x.list))) return -99;  // 名前と無関係なページは候補にしない（作品名つきの全文検索結果・登場人物ページは除く）
    const ftOnly=(!tm&&!dm&&!x.list&&x.it==null)?-3:0;             // 本文に名前が出るだけのページ（グッズ・声優など）は控えめに
    const unrelated=nctxs.length>0&&d&&!inT&&!inD&&!x.list;          // 作品名つきなのに作品と無関係（ハチワレ→サメ）
    const itb=unrelated?0:((x.it===0)?4:(x.it!=null)?2:0)*(work?0.5:1); // 「記事名に名前を含む」検索の上位は強い（intitle）。作品ページなら半分
    const exactBonus=(tm===6&&!work&&!x.list&&!unrelated)?2:0;       // 記事名そのもの（イーブイ）は作品タイトル内の一致より強い
    const tok=cleanTitle(from||t).split(/[・\s　]/).some(s=>norm(s)===nq)?1:0;
    const bd=tm===3?Math.min(boundary(nt),nf?boundary(nf):0):0;
    const viaSection=x.from&&!persona;              // 別名→作品や一覧ページへのリダイレクトは閲覧数を数えない
    const own=persona&&inD;                                   // その作品のキャラクター本人の記事
    const cm=nctxs.length?(own?7:(x.list||(inT&&/登場人物|キャラクター|一覧/.test(t)))?7:(inT||inD)?3:(realPerson?-3:(d?-2:0))):0;

    const wk=opt.work?(CREATIVE.test(d)?4:(d?-2:0)):0;               // 作品名を探しているときは作品（漫画・アニメ…）を優先 // 作品名つきの検索：その作品の登場人物ページを最優先

    const A=await getJSON(JA,Object.assign({action:'query',titles:opt.title,redirects:1},PAGEPROPS));
    const p=A.query.pages[0]; const rd=(A.query.redirects||[])[0];

  }else{

    const itRank={};
    if(S2&&S2.query&&S2.query.pages){ S2.query.pages.slice().sort((a,b)=>(a.index||0)-(b.index||0)).forEach((x,k)=>{itRank[x.title]=k;});

    const wdPersona=wdExact.filter(h=>isPersona(h.description));

      const wc=wdExact.filter(h=>CREATIVE.test(h.description||'')).sort((a,b)=>pri(a.description||'')-pri(b.description||''))[0];

    const isDis=!p.missing&&p.pageprops&&('disambiguation' in p.pageprops);
    const sameName=!p.missing&&norm(cleanTitle(p.title))===nq;
    const fulltext=(S&&S.query&&S.query.pages||[]).filter(x=>!x.missing&&!(x.pageprops&&'disambiguation' in x.pageprops)).sort((a,b)=>(a.index||0)-(b.index||0));
    fulltext.forEach(x=>{x.ft=true;x.it=(x.title in itRank)?itRank[x.title]:null;x.from=srFrom[x.title]||'';});

    if(!opt.work&&!nctxs.length&&!p.missing&&!isDis&&(sameName||!toSection)&&isPersona(p.description)){
      // 一番シンプルなケース：その名前の記事があって人物・キャラクター
      primary={title:p.title,qid:(p.pageprops||{}).wikibase_item,desc:p.description||'',label:cleanTitle(p.title)};
    }else if(!opt.work&&!nctxs.length&&!p.missing&&!isDis&&sameName&&CREATIVE.test(p.description||'')&&wdPersona.length){

    }else if(!nctxs.length&&!p.missing&&!isDis&&toSection&&!sameName){
      // 別の記事の一部へのリダイレクト（竈門炭治郎→鬼滅の刃、エレン→進撃の巨人の登場人物、ちいかわ→作品記事）
      const h=wdPersona[0];

    }else{

        (r.query.pages||[]).filter(x=>!x.missing&&!(x.pageprops&&'disambiguation' in x.pageprops)).forEach(x=>{x.from=rmap[x.title]||'';x.list=listTitles.has(x.title)||!!lmap[x.title]||(nctxs.length>0&&!norm(cleanTitle(x.title)).includes(nq)&&(nctxs.includes(norm(cleanTitle(x.title)))||nctxs.includes(norm(cleanTitle(rmap[x.title]||'')))||nctxs.some(c=>c.length>=3&&norm(cleanTitle(x.title)).startsWith(c)&&!isPersona(x.description)&&CREATIVE.test(x.description||''))));x.pageviews=pvmap[x.title]||{};pool.push(x);});

function claimVals(e,p){return ((e.claims||{})[p]||[]).map(c=>c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value).filter(Boolean);}
function parseWDTime(t){
  const m=/^([+-])(\d+)-(\d\d)-(\d\d)/.exec(t.time); if(!m) return null;
  const y=(m[1]==='-'?-1:1)*parseInt(m[2],10), mo=parseInt(m[3],10)||1, d=parseInt(m[4],10)||1;
  return {y,mo,d,prec:t.precision};
}
function fmtDate(x){if(!x)return '';const era=x.y<0?'紀元前':'';const y=Math.abs(x.y)+'年';if(x.prec<=9)return era+y;if(x.prec===10)return era+y+x.mo+'月';return era+y+x.mo+'月'+x.d+'日';}
function ageBetween(a,b){let age=b.y-a.y;if(b.mo<a.mo||(b.mo===a.mo&&b.d<a.d))age--;return age;}

/* ---------- 3. 本文からの抜き出し ---------- */
function sections(text){
  const out=[];let cur={h:'',lvl:0,body:''};
  for(const line of text.split('\n')){
    const m=/^(=+)\s*(.+?)\s*=+$/.exec(line);
    if(m){out.push(cur);cur={h:m[2],lvl:m[1].length,body:''};}else cur.body+=line+'\n';
  }
  out.push(cur);return out;
}
function characterSection(text,name){
  const secs=sections(text); const n=norm(name);
  if(!n) return null;
  let i=secs.findIndex(s=>norm(s.h)===n);
  if(i<0) i=secs.findIndex(s=>norm(s.h).includes(n));
  if(i<0){ // 「うずまき ナルト」「モンキー・D・ルフィ」など表記ゆれ：名前の後半・前半でも探す
    const parts=name.split(/[・\s]/).filter(x=>x.length>=2);
    if(parts.length>1) i=secs.findIndex(s=>parts.every(pt=>norm(s.h).includes(norm(pt))));
  }
  characterSection.lastHeading='';characterSection.byAlias=false;
  const isLeaf=k=>!(secs[k+1]&&secs[k+1].lvl>secs[k].lvl);
  if(i<0){ // 愛称で呼ばれるキャラ（たまちゃん→穂波たまえ）：末端の節で、冒頭に名前が出てくるものを使う
    i=secs.findIndex((s,k)=>s.lvl>=2&&isLeaf(k)&&norm(s.body.slice(0,240)).includes(n));
    if(i>=0) characterSection.byAlias=true;
    else{ // 見出しが無いキャラ：名前が最初に出る位置から一定量だけ切り出す
      const k=secs.findIndex(s=>norm(s.body).includes(n));
      if(k<0) return null;
      const b=secs[k].body; const pos=b.indexOf(name)>=0?b.indexOf(name):0;
      return b.slice(Math.max(0,pos-60),pos+1400);
    }
  }
  let body=secs[i].body; const lvl=secs[i].lvl;
  for(let j=i+1;j<secs.length&&secs[j].lvl>lvl;j++) body+='\n=== '+secs[j].h+' ===\n'+secs[j].body;
  const hd=secs[i].h.replace(/[（(].*$/,'').trim();
  const generic=/レギュラー|主要|主な|その他|一覧|家族|関係|卒業生|団$|隊$|軍$|組$|派$|側$|たち$|達$|メンバー|仲間|人物|キャラクター|概要|来歴|備考|上位|以下|以上|順|名$|位$|編$|章$|巻$|話$|期$|部$|篇$|回$|年$|校$|国$|里$|村$|町$|市$|\d/;
  if(characterSection.byAlias){ // 愛称一致：その節の中でも名前が出る前後だけを使う（他のキャラの記述を混ぜない）
    const pos=Math.max(0,body.indexOf(name)); body=body.slice(Math.max(0,pos-80),pos+1400);
    if(hd.length<=12&&!generic.test(hd)&&pos<300) characterSection.lastHeading=hd;
  }else if(hd.length<=14&&!generic.test(hd)&&norm(hd).includes(n)) characterSection.lastHeading=hd;
  return body;
}
let CUR_NAME='';

async function wikiImage(base,title){

  if(base!==EN||!p||p.missing) return null;

  const r2=await getJSON(EN,{action:'query',titles:p.title,generator:'images',gimlimit:20,prop:'imageinfo',iiprop:'url|mime|size',iiurlwidth:900}).catch(()=>null);

const FIELD_Q={origin:'出身',age:'年齢',like:'好きなもの',dislike:'嫌いなもの',can:'得意なこと',cant:'苦手なこと'};
function setField(k,main,sub,cls){
  els.v[k].textContent=main||'ー';els.v[k].className='main'+(main?'':' none')+(cls?' '+cls:'');els.v[k].title=main||'';
  if(!main&&FIELD_Q[k]){ // 見つからない項目は、その場でGoogle検索をタップできるようにする
    const q=currentName()+' '+FIELD_Q[k];
    els.s[k].innerHTML=(sub?esc(sub)+'　':'')+'<a class="sq" href="https://www.google.com/search?safe=active&q='+encodeURIComponent(q)+'" target="_blank" rel="noopener">🔍 Googleで調べる ↗</a>';
    els.s[k].title=sub||'';return;
  }
  els.s[k].textContent=sub||'';els.s[k].title=sub||'';
}
function waiting(k){els.v[k].textContent='しらべ中';els.v[k].className='main wait';els.s[k].textContent='';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setImage(src,from,link){
  els.img.classList.remove('show');
  if(!src){els.img.removeAttribute('src');els.empty.style.display='';els.cap.innerHTML='';return;}
  els.img.src=src;els.img.onload=()=>{els.img.classList.add('show');els.empty.style.display='none';};
  if(current&&!/^data:/.test(src)) current.img=src;
  els.img.onerror=()=>{noImage(link);};
  els.cap.innerHTML='<span>画像：'+esc(from)+'</span><span><button type="button" class="capbtn" id="changeImg">🔄 かえる</button>'+(link?' <a href="'+esc(link)+'" target="_blank" rel="noopener">記事を見る ↗</a>':'')+'</span>';
  $('changeImg').onclick=openChooser;
}
function chooserHTML(name,msg){
  const g='https://www.google.com/search?tbm=isch&safe=active&q='+encodeURIComponent(name||els.q.value);
  return '<div class="big">🎨</div><div>'+esc(msg)+'</div>'
    +'<div class="pick"><a class="pbtn g" href="'+g+'" target="_blank" rel="noopener">🔍 Google画像で探す</a>'
    +'<button type="button" class="pbtn" id="pasteBtn">📋 コピーした画像を貼る</button>'
    +'<button type="button" class="pbtn" id="fileBtn">📷 写真からえらぶ</button></div>'
    +'<div class="hint">探した画像を長押し →「コピー」→「貼る」の順でOK</div>';
}
function wireChooser(){
  const pb=$('pasteBtn'),fb=$('fileBtn');
  if(pb) pb.onclick=pasteFromClipboard;
  if(fb) fb.onclick=()=>$('pick').click();
}
function noImage(link,name){
  els.img.removeAttribute('src');els.img.classList.remove('show');els.empty.style.display='';
  els.empty.innerHTML=chooserHTML(name,'Wikipediaに画像がありませんでした');wireChooser();
  els.cap.innerHTML=link?'<span></span><a href="'+esc(link)+'" target="_blank" rel="noopener">記事を見る ↗</a>':'';
}
function openChooser(){ // 画像を差し替えたいとき
  els.img.classList.remove('show');els.empty.style.display='';
  els.empty.innerHTML=chooserHTML(currentName(),'べつの画像にする');wireChooser();
}
function renderChips(cands,label){
  els.chips.innerHTML='';els.chips.dataset.favs='0';
  if(cands.length){const l=document.createElement('span');l.className='chiplabel';l.textContent=label||'もしかして：';els.chips.appendChild(l);}
  const names=cands.map(c=>cleanTitle(c.title||c.label||''));
  const last=norm((els.q.value.trim().split(/の|\s|　/).pop())||'');
  cands.forEach((c,i)=>{
    const b=document.createElement('button');b.type='button';b.className='chip';
    const full=c.title||c.label||''; const dup=names.filter(n=>n===names[i]).length>1;
    let text=dup?full:names[i]; let goName=names[i]; let goTitle=c.title||undefined;
    // 例：磯野波平（サザエさんの登場人物）…リダイレクト元の名前で表示し、その名前で開く
    if(c.from&&last&&norm(c.from).includes(last)&&/登場人物|一覧|キャラクター/.test(full)){text=cleanTitle(c.from)+'（'+cleanTitle(full)+'）';goName=cleanTitle(c.from);goTitle=c.from;}
    const d=c.desc?' <span class="d">'+esc(c.desc.slice(0,18))+'</span>':'';
    b.innerHTML=esc(text)+d;b.title=full+(c.desc?' — '+c.desc:'');
    b.onclick=()=>{els.q.value=goName;run(goName,{title:goTitle,qid:c.title?undefined:c.qid,desc:c.desc,label:c.label});};
    els.chips.appendChild(b);
  });
}

/* ---------- 6. メイン ---------- */
const EXTRACT={action:'query',redirects:1,prop:'extracts|pageimages|description|langlinks',explaintext:1,exlimit:1,piprop:'thumbnail',pithumbsize:900,pilicense:'any',lllang:'en'};
async function run(query,opt={}){
  const my=++seq; const q=query.trim(); if(!q) return;
  busy(true);
  ['name','origin','age','like','dislike','can','cant'].forEach(waiting);
  els.v.name.textContent=cleanTitle(q);els.v.name.className='main';
  setImage(null);els.empty.innerHTML='<div class="big">🔎</div><div>しらべています…</div>';
  try{
    let {primary,cands}=await resolve(q,opt);
    if(my!==seq) return;
    // 「サザエさんの波平」「ワンピース ゾロ」のように作品名つきで入力されたときは、後ろをキャラ名・前を手がかりにして探し直す
    const isWeak=!primary||(primary.title&&!primary.sectionOf&&!isPersona(primary.desc)&&norm(cleanTitle(primary.title))!==norm(q));
    const sp=/^(.{1,24})(?:の|\s|　)(.{1,20}?)$/.exec(q);
    if(isWeak&&sp&&!opt.title&&!opt.qid){
      const w=await resolve(sp[1],{work:true}).catch(()=>({primary:null}));   // まず作品名を記事として特定（別名を手がかりにする）
      if(my!==seq) return;
      const aliases=[sp[1]]; if(w.primary){if(w.primary.title)aliases.push(cleanTitle(w.primary.title));if(w.primary.label)aliases.push(w.primary.label);
        if(!w.primary.title&&w.primary.qid){const E=await getJSON(WD,{action:'wbgetentities',ids:w.primary.qid,props:'sitelinks|labels',languages:'ja|en',sitefilter:'jawiki|enwiki'}).catch(()=>null);const e=E&&E.entities&&E.entities[w.primary.qid];if(e){if(e.sitelinks&&e.sitelinks.jawiki)aliases.push(cleanTitle(e.sitelinks.jawiki.title));if(e.labels&&e.labels.en)aliases.push(e.labels.en.value);}}}
      if(my!==seq) return;
      const r2=await resolve(sp[2],{ctx:aliases});
      if(my!==seq) return;
      if(r2.primary){primary=r2.primary;cands=r2.cands;els.v.name.textContent=cleanTitle(sp[2]);}
    }
    const weak=!primary||(!primary.sectionOf&&!isPersona(primary.desc));
    renderChips(cands,weak?'ちがう？ もしかして：':'もしかして：');
    if(weak&&cands.length&&primary) show('ちがう人が出たら、上の「もしかして」から選んでね',3500);
    if(!primary) throw new Error('notfound');

    const jobs={};
    if(primary.qid) jobs.wd=getJSON(WD,{action:'wbgetentities',ids:primary.qid,props:'claims|sitelinks|labels|descriptions',languages:'ja|en',sitefilter:'jawiki|enwiki'}).catch(()=>null);
    if(primary.title) jobs.ja=getJSON(JA,Object.assign({titles:primary.title},EXTRACT)).catch(()=>null);
    let [wd,ja]=await Promise.all([jobs.wd,jobs.ja]);
    if(my!==seq) return;
    const ent=wd&&wd.entities&&wd.entities[primary.qid]&&!wd.entities[primary.qid].missing?wd.entities[primary.qid]:null;
    let title=primary.title, page=ja&&ja.query&&ja.query.pages&&ja.query.pages[0];
    let sectionOf=primary.sectionOf||null;
    if(!title&&ent){
      title=(ent.sitelinks&&ent.sitelinks.jawiki&&ent.sitelinks.jawiki.title)||null;
      if(title){ja=await getJSON(JA,Object.assign({titles:title},EXTRACT)).catch(()=>null);page=ja&&ja.query&&ja.query.pages&&ja.query.pages[0];
        if(page&&norm(cleanTitle(page.title))!==norm(cleanTitle(title))) sectionOf=page.title; }
    }
    if(my!==seq) return;
    if(page&&page.missing) page=null;
    const label=(ent&&ent.labels&&(ent.labels.ja||ent.labels.en)||{}).value;
    let dispName=cleanTitle(sectionOf?(primary.label||label||q):(title||label||primary.label||q));
    const enFromEnt=!!(ent&&ent.sitelinks&&ent.sitelinks.enwiki&&ent.sitelinks.enwiki.title);
    const enTitle=(ent&&ent.sitelinks&&ent.sitelinks.enwiki&&ent.sitelinks.enwiki.title)||(page&&page.langlinks&&page.langlinks[0]&&page.langlinks[0].title)||null;
    let text=(page&&page.extract)||'';
    let charOnly=null;
    if(sectionOf&&text){ charOnly=characterSection(text,dispName); if(charOnly&&characterSection.lastHeading) dispName=characterSection.lastHeading; }
    // 自分の記事が無いキャラは「登場人物」一覧ページから該当の節を探す
    if(!text||(sectionOf&&!charOnly)){
      const S=await getJSON(JA,{action:'query',list:'search',srsearch:'"'+dispName+'"',srlimit:6}).catch(()=>null);
      const hits=(S&&S.query&&S.query.search)||[];
      const hit=hits.find(h=>/登場人物|キャラクター|一覧/.test(h.title))||hits[0];
      if(hit&&hit.title!==(page&&page.title)){
        const R=await getJSON(JA,{action:'query',titles:hit.title,prop:'extracts',explaintext:1,exlimit:1}).catch(()=>null);
        const full=(R&&R.query.pages[0].extract)||'';
        const sec=characterSection(full,dispName);
        if(sec){charOnly=sec;text=full;sectionOf=hit.title;if(!title)title=hit.title;if(characterSection.lastHeading)dispName=characterSection.lastHeading;}
      }
    }
    if(my!==seq) return;
    const body=charOnly||text;
    const link=title?'https://ja.wikipedia.org/wiki/'+encodeURIComponent(sectionOf||title)+(sectionOf?'#'+encodeURIComponent(dispName):''):(enTitle?'https://en.wikipedia.org/wiki/'+encodeURIComponent(enTitle):'');
    let desc=(ent&&ent.descriptions&&ent.descriptions.ja&&ent.descriptions.ja.value)||(!sectionOf&&page&&page.description)||primary.desc||'';
    if(sectionOf&&(!desc||/一覧記事/.test(desc))) desc='『'+cleanTitle(sectionOf).replace(/の(登場|主な)?(人物|キャラクター).*$/,'')+'』の登場人物';
    const intro=(sectionOf?body:text).split(/\n==/)[0];
    setField('name',dispName,[sectionOf?'':extractReading(intro,dispName),desc].filter(Boolean).join('　'));
    current={name:dispName,title:sectionOf?null:title,qid:primary.qid||null,img:null};updateFavBtn();CUR_NAME=dispName;

    // 画像：候補を順に試し、実際に読み込めた最初の1枚を使う
    (async()=>{
      const manual=getManual(dispName); if(manual){setImage(manual,'自分で追加した画像',link);return;}
      const human=ent&&claimVals(ent,'P31').some(v=>v.id==='Q5');
      const p18=ent&&claimVals(ent,'P18')[0];
      const tP18=()=>p18?['https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(p18)+'?width=900','Wikimedia Commons']:null;
      const tJa=()=>(page&&page.thumbnail&&!sectionOf)?[page.thumbnail.source,'Wikipedia']:null;
      const tEn=async()=>{const s=enTitle?await wikiImage(EN,enTitle):null;return s?[s,'Wikipedia（英語版）']:null;};
      const tJaAny=()=>(page&&page.thumbnail)?[page.thumbnail.source,'Wikipedia（'+cleanTitle(page.title)+'）']:null;
      const tCat=async()=>{const s=ent?await commonsImage(claimVals(ent,'P373')[0]):null;return s?[s,'Wikimedia Commons']:null;};
      const tGoogle=async()=>{const g=await googleImage(dispName);return g?[g.src,g.from]:null;};
      const tiers=human?[tGoogle,tP18,tJa,tEn,tJaAny,tCat]:[tGoogle,tEn,tJa,tP18,tJaAny,tCat];
      for(const t of tiers){
        const r=await t(); if(my!==seq) return;
        if(r&&r[0]&&await loadImg(r[0])){ if(my!==seq) return; setImage(r[0],r[1],link); return; }
      }
      if(my===seq) noImage(link,dispName);
    })();

    // 出身・年齢（Wikidata優先 → 本文）
    const isHuman=ent&&claimVals(ent,'P31').some(v=>v.id==='Q5');
    let originMain='',originSub='',ageMain='',ageSub='';
    const p19=ent&&claimVals(ent,'P19')[0], p27=ent&&claimVals(ent,'P27')[0], p1441=ent?claimVals(ent,'P1441').slice(0,5):[], p1080=ent&&claimVals(ent,'P1080')[0];
    const p106=ent?claimVals(ent,'P106').slice(0,3):[], p2563=ent?claimVals(ent,'P2563').slice(0,3):[];
    const ids=[];[p19,p27,p1080,...p1441,...p106,...p2563].forEach(v=>v&&v.id&&!ids.includes(v.id)&&ids.push(v.id));
    let labels={};
    if(ids.length){const L=await getJSON(WD,{action:'wbgetentities',ids:ids.join('|'),props:'labels',languages:'ja|en'}).catch(()=>null);if(L&&L.entities)for(const k in L.entities){const lb=L.entities[k].labels||{};labels[k]=(lb.ja||lb.en||{}).value||'';}}
    if(my!==seq) return;
    const textOrigin=extractOrigin(body);
    const OCC={'野球選手':'野球','プロ野球選手':'野球','サッカー選手':'サッカー','歌手':'歌','シンガーソングライター':'歌と作曲','俳優':'演技','女優':'演技','漫画家':'漫画を描く','小説家':'小説を書く','作家':'文章を書く','詩人':'詩を書く','政治家':'政治','将棋棋士':'将棋','棋士':'将棋','囲碁棋士':'囲碁','フィギュアスケート選手':'フィギュアスケート','ピアニスト':'ピアノ','画家':'絵を描く','声優':'声の演技','料理人':'料理','YouTuber':'動画づくり','お笑いタレント':'お笑い','お笑い芸人':'お笑い','漫才師':'漫才','武将':'戦','大名':'国をおさめる','作曲家':'作曲','音楽家':'音楽','ダンサー':'ダンス','バレエダンサー':'バレエ','テニス選手':'テニス','バスケットボール選手':'バスケットボール','水泳選手':'水泳','陸上競技選手':'陸上競技','柔道家':'柔道','力士':'相撲','プロレスラー':'プロレス','ボクサー':'ボクシング','発明家':'発明','物理学者':'物理学','数学者':'数学','天文学者':'天文学','医師':'医学','建築家':'建築','写真家':'写真','映画監督':'映画づくり','アニメーター':'アニメを描く','イラストレーター':'イラストを描く','ゲームクリエイター':'ゲームづくり','宇宙飛行士':'宇宙飛行','探検家':'探検','僧':'仏教','僧侶':'仏教','歌人':'和歌','俳人':'俳句','女房':'宮仕え','軍人':'軍事','実業家':'経営','教師':'教えること','教育者':'教えること'};
    const occupations=[...p106,...p2563].map(v=>labels[v.id]).filter(Boolean).map(l=>OCC[l]||l.replace(/選手$/,'')).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
    const work=p1441.map(v=>labels[v.id]).filter(Boolean).sort((a,b)=>(text.includes(b)?1:0)-(text.includes(a)?1:0))[0];
    if(p19&&labels[p19.id]){originMain=labels[p19.id];if(p27&&labels[p27.id]&&labels[p27.id]!==originMain)originSub=labels[p27.id];}
    else if(textOrigin){originMain=textOrigin;if(p27&&labels[p27.id])originSub=labels[p27.id];}
    else if(p27&&labels[p27.id]&&isHuman){originMain=labels[p27.id];}
    else if(p1080&&labels[p1080.id]){originMain=labels[p1080.id];originSub='作品の世界';}
    else if(work){originMain='『'+work+'』';originSub='登場する作品';}
    else if(p27&&labels[p27.id]){originMain=labels[p27.id];}
    setField('origin',originMain,originSub);

    const b=ent&&claimVals(ent,'P569')[0], d=ent&&claimVals(ent,'P570')[0];
    const bd=b&&parseWDTime(b), dd=d&&parseWDTime(d);
    const now=new Date(), today={y:now.getFullYear(),mo:now.getMonth()+1,d:now.getDate()};
    const ta=isHuman?'':extractAge(body), bday=isHuman?'':extractBirthday(body);
    if(ta){ageMain=ta;ageSub=(bday?'誕生日：'+bday+'　':'')+'作中の設定';}
    else if(bd&&dd&&ageBetween(bd,dd)>=0){ageMain=ageBetween(bd,dd)+'歳で死去';ageSub=fmtDate(bd)+' 〜 '+fmtDate(dd)+(isHuman?'':'（作中の設定）');}
    else if(bd&&ageBetween(bd,today)>=0&&ageBetween(bd,today)<130&&(isHuman||bd.prec>=11)){const a=ageBetween(bd,today);ageMain=(bd.prec<=9?'約':'')+a+'歳';ageSub=fmtDate(bd)+'生まれ'+(isHuman?'':'（作中の設定）');}
    else if(bd){ageSub=fmtDate(bd)+'生まれ（作中の設定）';}
    else if(bday){ageSub='誕生日：'+bday;}
    setField('age',ageMain,ageSub);

    // 好き・嫌い（日本語の本文 → 無ければ英語版の本文）
    let like=extractLikes(body), dis=extractDislikes(body), can=extractCan(body), cant=extractCant(body);
    const dropDup=(a,b)=>a.split('・').filter(x=>!b.split('・').includes(x)).join('・'); // 同じ語が2項目に出ないように
    cant=dropDup(cant,dis); can=dropDup(can,like);
    if(!can&&occupations.length){can=occupations.join('・').slice(0,30);}
    const src=sectionOf?'Wikipedia「'+cleanTitle(sectionOf)+'」より':'Wikipediaの記事より';
    let likeSub=like?src:'', disSub=dis?src:'', canSub=can?src:'', cantSub=cant?src:'';
    if((!like||!dis||!can||!cant||!ageMain)&&enTitle&&(enFromEnt||!sectionOf)){
      const E=await getJSON(EN,{action:'query',titles:enTitle,redirects:1,prop:'extracts',explaintext:1,exlimit:1}).catch(()=>null);
      if(my!==seq) return;
      const et=(E&&E.query&&E.query.pages&&E.query.pages[0]&&E.query.pages[0].extract)||'';
      if(et){
        if(!like){const r=extractLikesEn(et);if(r.length){like=r.join('・').slice(0,34);likeSub='英語版Wikipediaより';}}
        if(!dis){const r=extractDislikesEn(et);if(r.length){dis=r.join('・').slice(0,34);disSub='英語版Wikipediaより';}}
        if(!can){const r=extractCanEn(et);if(r.length){can=r.join('・').slice(0,34);canSub='英語版Wikipediaより';}}
        if(!cant){const r=extractCantEn(et);if(r.length){cant=r.join('・').slice(0,34);cantSub='英語版Wikipediaより';}}
        if(!ageMain&&!isHuman){const a=extractAgeEn(et);if(a){setField('age',a,'英語版Wikipediaより（作中の設定）');}}
      }
    }
    setField('like',like,like?likeSub:(body?'記事に書かれていません':'日本語の記事がありません'));
    setField('dislike',dis,dis?disSub:(body?'記事に書かれていません':'日本語の記事がありません'));
    setField('can',can,can?(canSub||'Wikidataの職業・能力より'):(body?'記事に書かれていません':'日本語の記事がありません'));
    setField('cant',cant,cant?cantSub:(body?'記事に書かれていません':'日本語の記事がありません'));
  }catch(e){
    if(my!==seq) return;
    ['origin','age','like','dislike','can','cant'].forEach(k=>setField(k,'',''));
    current=null;updateFavBtn();
    if(e&&e.message==='notfound'){setField('name',cleanTitle(q),'見つかりませんでした');noImage('',q);show(els.chips.querySelector('.chip')?'見つかりませんでした。上の「もしかして」から選んでね':'見つかりませんでした。別の言い方で試してみてね',3500);}
    else{setField('name',cleanTitle(q),'通信エラー');show('通信に失敗しました。もう一度試してみてね');console.error(e);}
  }finally{ if(my===seq) busy(false); }
}

/* ---------- 7. 手動画像（ドラッグ＆ドロップ／貼り付け） ---------- */
function mkey(n){return 'pb_img:'+n;}
function getManual(n){try{return localStorage.getItem(mkey(n));}catch(e){return null;}}
function setManual(n,v){try{if(v&&v.length<1500000)localStorage.setItem(mkey(n),v);}catch(e){}}
function currentName(){return els.v.name.textContent.trim();}
function shrink(src){ // 大きな写真は縮小して保存（タブレットのカメラロール対策）
  return new Promise(res=>{const im=new Image();im.onload=()=>{const M=1000,r=Math.min(1,M/Math.max(im.width,im.height));
    if(r>=1&&src.length<900000) return res(src);
    const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',.85));}catch(e){res(src);}};im.onerror=()=>res(null);im.src=src;});
}
async function acceptImage(src){
  if(!src) return; const n=currentName(); if(!n) return;
  if(/^data:/.test(src)) src=await shrink(src);
  if(src&&await loadImg(src)){setManual(n,src);setImage(src,'自分で追加した画像','');show('画像を入れました');}
  else show('この画像は読み込めませんでした。別の画像を試してね');
}
async function pasteFromClipboard(){
  try{
    if(navigator.clipboard&&navigator.clipboard.read){
      const items=await navigator.clipboard.read();
      for(const it of items){const t=it.types.find(x=>/^image\//.test(x));if(t){const b=await it.getType(t);return acceptImage(await fileToData(b));}}
      for(const it of items){if(it.types.includes('text/plain')){const txt=await (await it.getType('text/plain')).text();if(/^https?:\/\//.test(txt.trim()))return acceptImage(txt.trim());}}
    }
    if(navigator.clipboard&&navigator.clipboard.readText){const txt=await navigator.clipboard.readText();if(/^https?:\/\//.test((txt||'').trim()))return acceptImage(txt.trim());}
    show('コピーした画像が見つかりません。画像を長押し→「コピー」してからもう一度');
  }catch(e){show('貼り付けが許可されませんでした。「写真からえらぶ」を試してね');}
}
$('pick').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(f&&/^image\//.test(f.type)){acceptImage(await fileToData(f));}e.target.value='';});
function fileToData(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(file);});}
async function handleTransfer(dt){
  if(!dt) return;
  const f=[...(dt.files||[])].find(x=>/^image\//.test(x.type)); if(f){return acceptImage(await fileToData(f));}
  const html=dt.getData&&dt.getData('text/html'); if(html){const m=/<img[^>]+src=["']([^"']+)["']/i.exec(html);if(m)return acceptImage(m[1].replace(/&amp;/g,'&'));}
  const uri=dt.getData&&(dt.getData('text/uri-list')||dt.getData('text/plain')); if(uri&&/^https?:\/\//.test(uri.trim()))return acceptImage(uri.trim().split('\n')[0]);
}
['dragenter','dragover'].forEach(ev=>els.photo.addEventListener(ev,e=>{e.preventDefault();els.photo.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>els.photo.addEventListener(ev,e=>{e.preventDefault();els.photo.classList.remove('drag');}));
els.photo.addEventListener('drop',e=>handleTransfer(e.dataTransfer));
document.addEventListener('paste',e=>{if(document.activeElement===els.q)return;handleTransfer(e.clipboardData);});

/* ---------- 8. お気に入り（この端末に保存） ---------- */
let current=null; // いま表示中のプロフィール {name,title,qid,img}
function getFavs(){try{return JSON.parse(localStorage.getItem('pb_favs')||'[]');}catch(e){return [];}}
function saveFavs(a){try{localStorage.setItem('pb_favs',JSON.stringify(a.slice(0,60)));}catch(e){show('保存できませんでした（端末の空き容量）');}}
function isFav(n){return getFavs().some(f=>f.name===n);}
function updateFavBtn(){const b=$('favBtn');if(!current){b.style.display='none';return;}b.style.display='';const on=isFav(current.name);b.textContent=on?'★':'☆';b.classList.toggle('on',on);b.title=on?'お気に入りから外す':'お気に入りに登録';}
function toggleFav(){
  if(!current) return; let favs=getFavs();
  if(isFav(current.name)){favs=favs.filter(f=>f.name!==current.name);saveFavs(favs);show('お気に入りから外しました');}
  else{favs.unshift({name:current.name,title:current.title||null,qid:current.qid||null,img:(current.img&&!/^data:/.test(current.img))?current.img:null,at:Date.now()});saveFavs(favs);show('⭐ お気に入りに登録しました');}
  updateFavBtn(); if(!els.chips.children.length||els.chips.dataset.favs==='1') renderFavChips();
}
function openFav(f){$('favBox').classList.remove('on');els.q.value=f.name;run(f.name,f.title?{title:f.title}:(f.qid?{qid:f.qid,label:f.name}:{}));}
function renderFavChips(){ // 検索前はお気に入りをチップで並べる
  const favs=getFavs(); els.chips.innerHTML=''; els.chips.dataset.favs='1';
  if(favs.length){const l=document.createElement('span');l.className='chiplabel';l.textContent='⭐ お気に入り：';els.chips.appendChild(l);}
  favs.forEach(f=>{const b=document.createElement('button');b.type='button';b.className='chip fav';b.textContent='⭐ '+f.name;b.onclick=()=>openFav(f);els.chips.appendChild(b);});
}
function renderFavList(){
  const favs=getFavs(); const box=$('favList'); box.innerHTML='';
  if(!favs.length){box.innerHTML='<p>まだ登録がありません。しらべたあとにカードの ☆ を押してね</p>';return;}
  favs.forEach(f=>{
    const row=document.createElement('div');row.className='favrow';
    const th=document.createElement('div');th.className='th';if(f.img){const im=document.createElement('img');im.src=getManual(f.name)||f.img;im.alt='';im.referrerPolicy='no-referrer';th.appendChild(im);}else th.textContent='📖';
    const nm=document.createElement('button');nm.type='button';nm.className='nm';nm.textContent=f.name;nm.onclick=()=>openFav(f);
    const del=document.createElement('button');del.type='button';del.className='del';del.textContent='×';del.title='外す';del.onclick=()=>{saveFavs(getFavs().filter(x=>x.name!==f.name));renderFavList();updateFavBtn();if(els.chips.dataset.favs==='1')renderFavChips();};
    row.append(th,nm,del);box.appendChild(row);
  });
}
$('favBtn').onclick=toggleFav;
$('favListBtn').onclick=()=>{renderFavList();$('favBox').classList.add('on');};
$('closeFav').onclick=()=>$('favBox').classList.remove('on');
$('favBox').addEventListener('click',e=>{if(e.target===$('favBox'))$('favBox').classList.remove('on');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('favBox').classList.remove('on');});

/* ---------- 9. 起動 ---------- */
$('f').addEventListener('submit',e=>{e.preventDefault();run(els.q.value);});
const init=new URLSearchParams(location.search).get('q')||decodeURIComponent(location.hash.slice(1));
if(init){els.q.value=init;run(init);} else {els.q.focus();renderFavChips();}
updateFavBtn();
</script>
</body>
